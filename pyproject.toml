[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grantloop"
version = "0.1.0"
description = "Promise-to-proof agent fleet for federal grants"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The offline path — replay CLI, Sentinel, tests — needs nothing installed.
# These are only for the deployed cloud path.
cloud = [
  "google-cloud-pubsub>=2.21",
  "google-cloud-firestore>=2.16",
  "google-genai>=1.0",
  "google-adk>=1.0",
]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
# What the Cloud Run image installs: the API plus the Gemini escalation drafter.
# google-adk is deliberately excluded; the read API does not need it.
deploy = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "google-genai>=1.0"]
dev = ["pytest>=8.0", "fastapi>=0.110", "httpx>=0.27"]
# The video pipeline. Everything here runs locally: no account, no API key, no
# per-minute cost. Needs `brew install vhs` and `playwright install chromium`.
video = ["pocket-tts>=3.0", "soundfile>=0.12", "playwright>=1.40", "numpy>=1.26"]

[project.scripts]
grantloop-replay = "grantloop.replay.__main__:main"
grantloop-serve = "grantloop.api.__main__:main"

[tool.setuptools.packages.find]
# Explicit, because schema/, seed/ and dashboard/ are data directories sitting at
# the top level. Without this, setuptools flat-layout discovery treats them as
# packages and refuses to build.
include = ["grantloop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
