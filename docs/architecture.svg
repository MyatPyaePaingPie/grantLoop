<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="860" viewBox="0 0 1240 860" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475467"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a56db"/>
    </marker>
  </defs>

  <rect width="1240" height="860" fill="#ffffff"/>
  <text x="30" y="42" font-size="24" font-weight="700" fill="#1e2126">GrantLoop — architecture</text>
  <text x="30" y="66" font-size="13" fill="#6b7280">Promise-to-proof: the application and the award are one living object. No agent calls another agent; every transition is an event.</text>

  <!-- GCP boundary -->
  <rect x="30" y="90" width="1180" height="600" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="52" y="118" font-size="14" font-weight="700" fill="#475467">Google Cloud (project via GOOGLE_CLOUD_PROJECT — nothing hardcoded)</text>

  <!-- Inputs -->
  <rect x="55" y="150" width="200" height="120" rx="10" fill="#fffaeb" stroke="#b54708"/>
  <text x="70" y="175" font-size="13" font-weight="700" fill="#b54708">Inputs (simulated)</text>
  <text x="70" y="198" font-size="12" fill="#1e2126">• Grant application</text>
  <text x="70" y="218" font-size="12" fill="#1e2126">• Notice of Award</text>
  <text x="70" y="238" font-size="12" fill="#1e2126">• Ledger transaction stream</text>
  <text x="70" y="258" font-size="11" fill="#6b7280">deterministic seed = replay harness</text>

  <!-- Orchestrator service -->
  <rect x="310" y="140" width="360" height="260" rx="12" fill="#eef4ff" stroke="#1a56db" stroke-width="2"/>
  <text x="330" y="168" font-size="14" font-weight="700" fill="#1a56db">Cloud Run · orchestrator (ADK)</text>
  <rect x="330" y="182" width="150" height="44" rx="8" fill="#ffffff" stroke="#1a56db"/>
  <text x="340" y="200" font-size="12" font-weight="600" fill="#1e2126">Intake Agent</text>
  <text x="340" y="216" font-size="10" fill="#6b7280">docs → org knowledge</text>
  <rect x="500" y="182" width="150" height="44" rx="8" fill="#ffffff" stroke="#1a56db"/>
  <text x="510" y="200" font-size="12" font-weight="600" fill="#1e2126">Application Agent</text>
  <text x="510" y="216" font-size="10" fill="#6b7280">catches promise vs budget</text>
  <rect x="330" y="238" width="150" height="44" rx="8" fill="#ffffff" stroke="#1a56db"/>
  <text x="340" y="256" font-size="12" font-weight="600" fill="#1e2126">Covenant Agent</text>
  <text x="340" y="272" font-size="10" fill="#6b7280">award diff → obligations</text>
  <rect x="500" y="238" width="150" height="44" rx="8" fill="#ffffff" stroke="#1a56db"/>
  <text x="510" y="256" font-size="12" font-weight="600" fill="#1e2126">Reporting Agent</text>
  <text x="510" y="272" font-size="10" fill="#6b7280">SF-425 from ledger state</text>
  <rect x="330" y="294" width="320" height="40" rx="8" fill="#ffffff" stroke="#1a56db" stroke-dasharray="4 3"/>
  <text x="340" y="312" font-size="12" font-weight="600" fill="#1e2126">Read API  /api/state/*  +  serves dashboard</text>
  <text x="340" y="327" font-size="10" fill="#6b7280">UI computes no domain logic — renders fleet output only</text>
  <text x="330" y="360" font-size="11" fill="#6b7280">derived, not narrated: award deltas, headline,</text>
  <text x="330" y="376" font-size="11" fill="#6b7280">exceptions (incl. award_total_mismatch) are computed</text>

  <!-- Sentinel service -->
  <rect x="740" y="140" width="330" height="200" rx="12" fill="#fdf2fa" stroke="#c11574" stroke-width="2"/>
  <text x="760" y="168" font-size="14" font-weight="700" fill="#c11574">Cloud Run · ledger-sentinel</text>
  <text x="760" y="192" font-size="12" fill="#1e2126">Deterministic rule engine — not a model verdict.</text>
  <text x="760" y="210" font-size="12" fill="#1e2126">21 rules → 7 determination values, every citation</text>
  <text x="760" y="228" font-size="12" fill="#1e2126">eCFR-verified (ruleset v1.0.0, snapshot 2026-08-01)</text>
  <text x="760" y="252" font-size="11" fill="#6b7280">only push-subscription, high-volume, retry-heavy</text>
  <text x="760" y="268" font-size="11" fill="#6b7280">component — isolated for honest retry/DLQ demo</text>
  <text x="760" y="296" font-size="12" font-weight="600" fill="#b42318">Unmatched costs escalate to a human.</text>
  <text x="760" y="314" font-size="12" font-weight="600" fill="#b42318">Silence is never approval.</text>

  <!-- Event bus -->
  <rect x="310" y="430" width="760" height="70" rx="10" fill="#ecfdf3" stroke="#157f3d" stroke-width="2"/>
  <text x="330" y="456" font-size="14" font-weight="700" fill="#157f3d">Event contract v1 — 12 topics (in-process transport today; Pub/Sub at deploy)</text>
  <text x="330" y="478" font-size="12" fill="#1e2126">every event carries causation_id · every handler idempotent (dedupe doc written in the same transaction) · 5 attempts → DLQ</text>

  <!-- Firestore -->
  <rect x="55" y="430" width="200" height="110" rx="10" fill="#f4f3ff" stroke="#6941c6" stroke-width="2"/>
  <text x="70" y="456" font-size="13" font-weight="700" fill="#6941c6">Firestore</text>
  <text x="70" y="478" font-size="12" fill="#1e2126">obligation store — every</text>
  <text x="70" y="496" font-size="12" fill="#1e2126">obligation carries source</text>
  <text x="70" y="514" font-size="12" fill="#1e2126">(doc + locator + quote) + award_delta</text>
  <text x="70" y="532" font-size="10" fill="#6b7280">lineage is a graph query, not a story</text>

  <!-- Gemini -->
  <rect x="740" y="560" width="330" height="100" rx="10" fill="#eff8ff" stroke="#175cd3" stroke-width="2"/>
  <text x="760" y="586" font-size="13" font-weight="700" fill="#175cd3">Vertex AI · gemini-3.5-flash (location=global)</text>
  <text x="760" y="608" font-size="12" fill="#1e2126">Drafts the human-facing escalation question,</text>
  <text x="760" y="626" font-size="12" fill="#1e2126">grounded in the rule that fired. The model never</text>
  <text x="760" y="644" font-size="12" fill="#1e2126">makes the determination — rules + citations do.</text>

  <!-- DLQ panel -->
  <rect x="310" y="560" width="330" height="100" rx="10" fill="#fef3f2" stroke="#b42318" stroke-width="2"/>
  <text x="330" y="586" font-size="13" font-weight="700" fill="#b42318">DLQ → visible exception panel</text>
  <text x="330" y="608" font-size="12" fill="#1e2126">Poisoned messages retry 5×, then land on screen,</text>
  <text x="330" y="626" font-size="12" fill="#1e2126">loudly. Failure handling is a feature of the demo</text>
  <text x="330" y="644" font-size="12" fill="#1e2126">(replay --dlq forces one on camera).</text>

  <!-- Humans -->
  <rect x="30" y="710" width="1180" height="120" rx="14" fill="#fffaeb" stroke="#b54708" stroke-width="2"/>
  <text x="52" y="738" font-size="14" font-weight="700" fill="#b54708">Human-authority boundary (hard)</text>
  <text x="52" y="762" font-size="12" fill="#1e2126">• SF-425 is uncertified by construction — only an official authorized to legally bind the recipient certifies (2 CFR 200.415(a), verbatim statutory gate in the API). Submission labelled simulated.</text>
  <text x="52" y="784" font-size="12" fill="#1e2126">• Escalations (e.g. "is this organization's primary purpose lobbying?") are questions only a human can answer — the fleet routes them, never resolves them.</text>
  <text x="52" y="806" font-size="12" fill="#1e2126">• Dashboard (static, zero-dependency) is the shared surface where humans see everything the fleet did, with per-figure click-through to source transactions.</text>

  <!-- Arrows -->
  <line x1="255" y1="210" x2="310" y2="210" stroke="#475467" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="670" y1="240" x2="740" y2="240" stroke="#475467" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="678" y="232" font-size="10" fill="#6b7280">events only</text>
  <line x1="490" y1="400" x2="490" y2="430" stroke="#157f3d" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="905" y1="340" x2="905" y2="430" stroke="#157f3d" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="310" y1="465" x2="255" y2="465" stroke="#6941c6" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="475" y1="500" x2="475" y2="560" stroke="#b42318" stroke-width="2" marker-end="url(#arr)"/>
  <text x="483" y="535" font-size="10" fill="#6b7280">after 5 attempts</text>
  <line x1="905" y1="500" x2="905" y2="560" stroke="#175cd3" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrb)"/>
  <text x="913" y="535" font-size="10" fill="#6b7280">escalation events</text>
  <line x1="620" y1="690" x2="620" y2="710" stroke="#b54708" stroke-width="2" marker-end="url(#arr)"/>
</svg>
