<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GrantLoop — Riverbend Youth Services</title>
<style>
  :root {
    --bg: #f7f6f2; --panel: #ffffff; --ink: #1e2126; --muted: #6b7280;
    --line: #e5e2da; --accent: #1a56db; --good: #157f3d; --bad: #b42318;
    --warn: #b54708; --info: #175cd3; --violet: #6941c6; --slate: #475467;
    --pink: #c11574;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 14px 24px; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 18px; letter-spacing: -0.01em; }
  header h1 span { color: var(--accent); }
  .meta { color: var(--muted); font-size: 13px; }
  .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #eef4ff; color: var(--info); border: 1px solid #d1e0ff; }
  nav { display: flex; gap: 4px; padding: 10px 24px 0; background: var(--panel); border-bottom: 1px solid var(--line); }
  nav button { border: 1px solid transparent; border-bottom: none; background: none; padding: 8px 14px; font: inherit; font-size: 14px; color: var(--muted); cursor: pointer; border-radius: 8px 8px 0 0; }
  nav button.active { background: var(--bg); border-color: var(--line); color: var(--ink); font-weight: 600; }
  main { padding: 20px 24px 60px; max-width: 1100px; margin: 0 auto; }
  section { display: none; }
  section.active { display: block; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
  h2 { font-size: 15px; margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .cut { color: var(--bad); font-weight: 600; }
  .kept { color: var(--good); font-weight: 600; }
  .det { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1px solid; white-space: nowrap; }
  .cite { font-size: 12px; color: var(--muted); }
  .cite.unverified { color: var(--warn); }
  .callout { border-left: 4px solid var(--accent); background: #f0f5ff; padding: 12px 14px; border-radius: 0 8px 8px 0; margin-bottom: 16px; }
  .callout strong { display: block; margin-bottom: 2px; }
  .empty { color: var(--muted); font-style: italic; padding: 18px; text-align: center; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .certify { display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px dashed var(--line); border-radius: 8px; margin-top: 14px; }
  .certify button { background: var(--accent); color: #fff; border: none; padding: 8px 18px; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; }
  .certify button:disabled { background: #cbd5e1; cursor: not-allowed; }
  .simulated { position: fixed; bottom: 14px; right: 18px; background: var(--ink); color: #fff; font-size: 12px; padding: 4px 12px; border-radius: 999px; opacity: 0.85; }
  .err { color: var(--bad); padding: 30px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Grant<span>Loop</span></h1>
  <div class="meta" id="org-meta">loading…</div>
  <span class="badge" id="mode-badge">REPLAY MODE</span>
</header>
<nav id="tabs">
  <button data-tab="award" class="active">Award Handoff</button>
  <button data-tab="sentinel">Ledger Sentinel</button>
  <button data-tab="dlq">Exceptions / DLQ</button>
  <button data-tab="report">SF-425</button>
</nav>
<main>
  <section id="award" class="active"></section>
  <section id="sentinel"></section>
  <section id="dlq"></section>
  <section id="report"></section>
</main>
<div class="simulated">SIMULATED DATA — DEMO</div>

<script>
// Citations stay hidden until the eCFR verification pass clears
// allowability_rules.v0.json (VERIFICATION_STATUS: DRAFT).
const CITATIONS_VERIFIED = false;

const DET_STYLE = {
  presumptively_allowable:      { label: "Allowable",            color: "var(--good)",   bg: "#ecfdf3" },
  presumptively_unallowable:    { label: "Unallowable",          color: "var(--bad)",    bg: "#fef3f2" },
  missing_documentation:        { label: "Missing docs",         color: "var(--warn)",   bg: "#fffaeb" },
  requires_allocation:          { label: "Needs allocation",     color: "var(--info)",   bg: "#eff8ff" },
  requires_prior_approval:      { label: "Prior approval",       color: "var(--violet)", bg: "#f4f3ff" },
  conflicts_with_award_terms:   { label: "Conflicts w/ award",   color: "var(--pink)",   bg: "#fdf2fa" },
  requires_human_determination: { label: "Human decision",       color: "var(--slate)",  bg: "#f8fafc" },
};

const $ = (sel) => document.querySelector(sel);
const usd = (n) => n.toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });

function detBadge(value) {
  const s = DET_STYLE[value] || { label: value, color: "var(--muted)", bg: "#fff" };
  return `<span class="det" style="color:${s.color};border-color:${s.color};background:${s.bg}">${s.label}</span>`;
}
function cite(list) {
  if (!list || !list.length) return "";
  return CITATIONS_VERIFIED
    ? `<span class="cite">2 CFR ${list.map(c => "§" + c).join(", ")}</span>`
    : `<span class="cite unverified">citation pending eCFR verification</span>`;
}

function renderAward(seed) {
  const noa = seed.notice_of_award;
  const lines = Object.fromEntries(seed.application.budget_lines.map(l => [l.line_id, l]));
  const deltas = noa.AWARD_DELTAS_TO_SURFACE;
  const rows = deltas.map(d => {
    const line = lines[d.obligation_ref];
    const name = line ? line.cost_category : d.obligation_ref;
    let awarded;
    if (d.status === "reduced") awarded = `<span class="cut">${usd(d.awarded_value)} ▼</span>`;
    else if (d.status === "unchanged") awarded = `<span class="kept">${typeof d.awarded_value === "number" ? usd(d.awarded_value) : d.awarded_value} — unchanged</span>`;
    else awarded = `${usd(d.awarded_value)} ⚠ condition`;
    const proposed = typeof d.proposed_value === "number" ? usd(d.proposed_value) : d.proposed_value;
    return `<tr><td>${name}</td><td class="num">${proposed}</td><td class="num">${awarded}</td><td class="cite">${d.agency_note} ${d.downstream_effect ? "· " + d.downstream_effect : ""}</td></tr>`;
  }).join("");
  $("#award").innerHTML = `
    <div class="callout"><strong>They cut the money. They kept the promise.</strong>
    Covenant diffed the Notice of Award (${noa.award_id}, ${usd(noa.federal_share)}) against the proposal.
    Reductions below — and the performance targets were accepted <em>unchanged</em>.</div>
    <div class="panel"><h2>Award vs. proposal</h2>
    <table><thead><tr><th>Obligation</th><th class="num">Proposed</th><th class="num">Awarded</th><th>Agency note / downstream effect</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    <div class="panel"><h2>Specific conditions attached</h2>
    <table><tbody>${noa.specific_conditions.map(c =>
      `<tr><td><strong>${c.condition_id}</strong></td><td>${c.text}</td><td>${cite(c.citation ? [c.citation.section] : [])}</td><td class="cite">lifted when: ${c.removal_criteria}</td></tr>`).join("")}
    </tbody></table></div>`;
}

function renderSentinel(seed) {
  const txns = seed.ledger_stream.transactions;
  const legend = Object.entries(DET_STYLE).map(([k]) => detBadge(k)).join(" ");
  const rows = txns.map(t => `
    <tr><td class="cite">${t.date}</td><td><strong>${t.vendor}</strong><br><span class="cite">${t.memo} · ${t.gl_account}</span></td>
    <td class="num">${usd(t.amount)}</td><td>${detBadge(t.expected_determination)}<br>${cite(t.expected_citations)}</td></tr>`).join("");
  $("#sentinel").innerHTML = `
    <div class="panel"><h2>Determination legend — seven values, seven behaviors</h2><div class="legend">${legend}</div></div>
    <div class="panel"><h2>Live ledger stream (replay of seed)</h2>
    <table><thead><tr><th>Date</th><th>Transaction</th><th class="num">Amount</th><th>Sentinel determination</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function renderDLQ() {
  $("#dlq").innerHTML = `
    <div class="panel"><h2>Dead-letter queue / exception panel</h2>
    <div class="empty">No poisoned messages. Handlers retry 5× before landing here — when one does, it shows up loudly, not silently.<br>
    (Live mode wires this to the Pub/Sub DLQ subscription.)</div></div>`;
}

function renderReport(seed) {
  const r = seed.reporting.first_report;
  const txns = seed.ledger_stream.transactions;
  const disbursed = txns.filter(t => t.expected_determination === "presumptively_allowable").reduce((a, t) => a + t.amount, 0);
  $("#report").innerHTML = `
    <div class="panel"><h2>${r.form} — ${r.report_id} (${r.period_start} → ${r.period_end})</h2>
    <p class="cite">Due ${r.due_date} · quarterly cadence per specific condition SC-1</p>
    <table><thead><tr><th>Line</th><th class="num">Amount</th><th>Source</th></tr></thead><tbody>
      <tr><td>10e. Federal share of expenditures (clean determinations only)</td><td class="num">${usd(disbursed)}</td>
      <td class="cite">computed from ${txns.length} ledger transactions — every figure click-through to its transaction (live mode)</td></tr>
      <tr><td>Unresolved exceptions attached</td>
      <td class="num">${txns.filter(t => t.expected_determination !== "presumptively_allowable").length}</td>
      <td class="cite">nothing certified while exceptions are open — they ride along, visibly</td></tr>
    </tbody></table>
    <div class="certify">
      <button disabled title="Human-authority boundary: only the certifying official may certify">Certify &amp; submit</button>
      <span class="cite">Waits for ${r.certifying_official}. The system assembles; a human certifies. Export is labelled <strong>simulated</strong>.</span>
    </div></div>`;
}

document.getElementById("tabs").addEventListener("click", (e) => {
  const btn = e.target.closest("button"); if (!btn) return;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b === btn));
  document.querySelectorAll("main section").forEach(s => s.classList.toggle("active", s.id === btn.dataset.tab));
});

fetch("../seed/riverbend_scenario.json")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(seed => {
    $("#org-meta").textContent = `${seed.org.legal_name} · UEI ${seed.org.uei} · award ${seed.notice_of_award.award_id}`;
    renderAward(seed); renderSentinel(seed); renderDLQ(); renderReport(seed);
  })
  .catch(err => {
    document.querySelector("main").innerHTML =
      `<div class="err">Could not load seed data (${err.message}). Serve from the repo root, e.g. <code>python3 -m http.server</code>, then open /dashboard/.</div>`;
  });
</script>
</body>
</html>
